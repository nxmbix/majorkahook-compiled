name: build
on: workflow_dispatch
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - run: msbuild (Get-ChildItem -Recurse -Filter *.sln | Select -First 1).FullName /p:Configuration=Release /p:Platform=x32
      - uses: actions/upload-artifact@v4
        with:
          name: dll
          path: '**/*.dll'
